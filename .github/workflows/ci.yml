name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaagaz
          POSTGRES_PASSWORD: kaagaz
          POSTGRES_DB: kaagaz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaagaz" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kaagaz:kaagaz@localhost:5432/kaagaz_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - name: Enable pg_trgm (as on Neon)
        run: PGPASSWORD=kaagaz psql -h localhost -U kaagaz -d kaagaz_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t kaagaz-api backend
